<!DOCTYPE html>
<html>
<head>
    <title>Practica Web 10%</title>
    <style>
        body {
            background-color: #eaf7f0;
            font-family: Arial;
        }

        h1 {
            background-color: #50C878;
            color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 3px 3px 5px #722F37;
            text-align: center;
        }

        hr {
            height: 5px;
            background-color: #722F37;
            border: none;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .linea-verde {
            height: 8px;
            background-color: #50C878;
        }

        table {
            border: 4px solid #722F37;
            background-color: white;
            margin: auto;
        }

        td {
            border: 2px solid #50C878;
            padding: 10px;
        }

        th {
            border: 2px solid #50C878;
            background-color: #722F37;
            color: white;
            padding: 10px;
        }

        .animacion-imagen {
            border-radius: 20px;
            box-shadow: 5px 5px 10px gray;
            transition: 0.5s;
            margin: 10px;
        }

        .animacion-imagen:hover {
            transform: scale(1.1);
        }

        .mi-formulario {
            background-color: white;
            border: 3px solid #50C878;
            padding: 20px;
            width: 250px;
            border-radius: 15px;
            margin-left: 20px;
        }

        input {
            border: 1px solid #722F37;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .mi-boton {
            background-color: #722F37;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 2px 2px 5px black;
            transition: 0.3s;
        }

        .mi-boton:hover {
            background-color: #50C878;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Mi Practica de HTML</h1>

    <hr>

    <table>
        <tr>
            <th>Parte de la tarea</th>
            <th>Puntos</th>
        </tr>
        <tr>
            <td>Hacer el titulo y la tabla</td>
            <td>3%</td>
        </tr>
        <tr>
            <td>Formulario y los botones</td>
            <td>4%</td>
        </tr>
        <tr>
            <td>Galeria de imagenes</td>
            <td>3%</td>
        </tr>
    </table>

    <hr class="linea-verde">

    <center>
        <img src="imagen_prueba.jpg" width="450" height="250" class="animacion-imagen">
    </center>

    <hr>

    <div class="mi-formulario">
        <form>
            <label>Codigo:</label><br>
            <input type="text"><br>
            
            <label>Nombre:</label><br>
            <input type="text"><br>
            
            <label>Direccion:</label><br>
            <input type="text"><br>
            
            <label>Correo:</label><br>
            <input type="email"><br>
            
            <label>Contraseña:</label><br>
            <input type="password"><br><br>

            <button type="button" class="mi-boton">Guardar</button>
            <button type="button" class="mi-boton" onclick="window.print()">Imprimir</button>
            <button type="button" class="mi-boton" onclick="window.close()">Salir</button>
        </form>
    </div>

    <hr class="linea-verde">

    <center>
        <img src="imagen1.jpg" width="220" height="150" class="animacion-imagen">
        <img src="imagen2.jpg" width="220" height="150" class="animacion-imagen">
        <img src="imagen3.jpg" width="220" height="150" class="animacion-imagen">
    </center>

</body>
</html>
